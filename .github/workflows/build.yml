name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: current

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! gradle build --no-daemon 2>&1 | tee build.log; then
            # Surface the important part of the log as annotations
            grep -nE 'error:|What went wrong|Could not|FAILURE|> ' build.log | head -c 60000 > errs.txt || true
            echo "errors: $(grep -c 'error:' build.log)" >> errs.txt
            python3 - <<'PY'
          import urllib.parse
          t=open('errs.txt').read()
          for i in range(0, len(t), 8000):
              chunk=t[i:i+8000].replace('%','%25').replace('\r','').replace('\n','%0A')
              print(f'::error title=build-log-{i//8000}::{chunk}')
          PY
            exit 1
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v5
        with:
          name: primordial-jar
          path: build/libs/*.jar
          if-no-files-found: error
