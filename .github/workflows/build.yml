name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: current

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          cp build.log /tmp/build.log
          git checkout --orphan ci-logs
          git rm -rfq . || true
          cp /tmp/build.log build.log
          git add build.log
          git commit -qm "build log for ${GITHUB_SHA}"
          git push -f origin ci-logs

      - name: Upload jar
        uses: actions/upload-artifact@v5
        with:
          name: primordial-jar
          path: build/libs/*.jar
          if-no-files-found: error
